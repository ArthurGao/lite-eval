name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          version: "0.10.8"
      - run: uv sync --locked --all-extras   # a bare `uv sync` drops the extras (design §3 L26)
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v   # fakes only; `-m ollama` (real local models) stays local
      - run: uv run lite-eval --help   # the real console entry point, not only CliRunner

  # The declared lower bounds are real: every direct dependency at its lowest allowed version
  # (pyproject.toml ranges, AGENTS.md rule 13), the whole suite.
  lowest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          version: "0.10.8"
      - run: uv venv --python 3.12
      - run: uv pip install --resolution lowest-direct -e ".[server,ranking,judge]" pytest==9.2.0 pytest-asyncio==1.5.0
      - run: .venv/bin/python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115   # v6
        with:
          package_json_file: frontend/package.json   # the version comes from its packageManager field
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
