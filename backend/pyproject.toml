[project]
name = "lite-eval"
version = "0.2.0"
description = "A general evaluation module for AI applications: generate once, score many, honest comparisons and gates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# Other projects import lite-eval as a library, so runtime dependencies are ranges: the lower
# bound is the oldest version the test suite passes on (CI job `lowest`, `--resolution
# lowest-direct`), the upper bound the next major. uv.lock pins exact versions for lite-eval's
# own runs and CI (`uv sync --locked`); tests/unit/test_dependencies.py pins the APIs relied on.
# AGENTS.md rule 13.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.19,<1",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0.1,<7",  # 6.0 has no Python 3.12 wheel and does not build
    # httpx2, not httpx: the openai SDK (judges, E5) and mcp already run on httpx2; one HTTP client per process.
    "httpx2>=2.16,<3",
    # Paired bootstrap for comparisons (design §18.2): 10 000 resamples need vectorised sums.
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
# The Viewer's API (E3).
server = [
    "fastapi>=0.133,<1",  # the oldest that accepts starlette 1.2
    # 1.2.0 is the first Starlette whose TestClient runs on httpx2 (one HTTP client per process).
    "starlette>=1.2.0,<2",
    "uvicorn>=0.32,<1",
]
# Ranking metrics cross-check and statistics (E2).
ranking = [
    "ranx>=0.3.21,<0.4",
    "scipy>=1.13,<2",
]
# Model judges through an OpenAI-compatible endpoint (E5).
judge = [
    "openai>=3.46,<4",
]

[project.scripts]
lite-eval = "lite_eval.cli:app"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-pyyaml==6.0.12.20261111",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The Viewer build is gitignored but must ship in the wheel and sdist (design §18.14).
artifacts = ["src/lite_eval/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/lite_eval"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "TID"]
# Full-width punctuation is intentional in Chinese test data and prompts.
allowed-confusables = ["：", "（", "）", "！", "？"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use httpx2: the openai SDK and Starlette's TestClient run on it (project KB, decisions)."

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No py.typed in these (ranking extra; checked in the installed 0.3.21 / 1.18.1 sources).
module = ["ranx", "ranx.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Opt-in, deselected by default: `-m ollama` (real local models on 127.0.0.1:11434).
addopts = "-m 'not ollama'"
markers = [
    "ollama: uses a real local model through Ollama (opt-in: uv run pytest -m ollama)",
]
